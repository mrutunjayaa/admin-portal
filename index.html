<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mrutunjaya — CRM, Bug Bounty, Hotel & Planner</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
  
  <!-- ChartJS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* ==========================================================================
       1. CSS VARIABLES & DESIGN SYSTEM (DARK & LIGHT THEMES)
       ========================================================================== */
    :root[data-theme="dark"] {
      --bg-primary: #0c0d10;
      --bg-secondary: #1a1b20;
      --bg-tertiary: #27282e;
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --gold: #ffffff;
      --gold-light: #f4f4f5;
      --gold-alpha: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.03);
      --success: #25D366;
      --success-alpha: rgba(37, 211, 102, 0.15);
      --danger: #ef4444;
      --warning: #fdb630;
      --info: #3b82f6;
      --sidebar-width: 260px;
      --sidebar-collapsed: 78px;
      --topbar-height: 70px;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
      --glass: rgba(12, 13, 16, 0.8);
      --glass-blur: blur(16px);
      --card-bg: #1a1b20;
      --btn-text: #000000;
      --purple-text: #a78bfa;
      --badge-warning-text: var(--warning);
    }

    :root[data-theme="light"] {
      --bg-primary: #f0fdf4;
      --bg-secondary: #ffffff;
      --bg-tertiary: #dcfce7;
      --text-primary: #064e3b;
      --text-secondary: #0f766e;
      --text-muted: #64748b;
      --gold: #10b981;
      --gold-light: #34d399;
      --gold-alpha: rgba(16, 185, 129, 0.15);
      --border: rgba(16, 185, 129, 0.2);
      --border-light: rgba(0, 0, 0, 0.05);
      --success: #25D366;
      --success-alpha: rgba(37, 211, 102, 0.15);
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
      --sidebar-width: 260px;
      --sidebar-collapsed: 78px;
      --topbar-height: 70px;
      --shadow: 0 10px 30px -10px rgba(16, 185, 129, 0.2);
      --glass: rgba(255, 255, 255, 0.85);
      --glass-blur: blur(16px);
      --card-bg: #ffffff;
      --btn-text: #ffffff;
      --purple-text: #7c3aed;
      --badge-warning-text: #b45309;
    }

    /* Font overrides */
    .material-icons-round {
      font-family: 'Material Symbols Rounded', 'Material Icons Round' !important;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold);
    }

    h1, h2, h3, h4, .title-font {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
    }

    /* ==========================================================================
       2. LAYOUT: SIDEBAR, TOPBAR & VIEW CONTROLLER
       ========================================================================== */
    .app-wrapper {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* Sidebar Styles */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-brand {
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .sidebar-brand i {
      color: var(--gold);
      font-size: 1.8rem;
    }

    .sidebar-brand span {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .sidebar-brand span span {
      color: var(--gold);
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 16px 8px;
    }

    .nav-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      padding: 12px 12px 6px 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .sidebar-category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 12px 6px 12px;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
      margin-top: 6px;
    }
    .sidebar-category-header:hover {
      color: var(--gold-light);
    }
    .sidebar-category-links {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 6px;
    }
    .sidebar-category-links.expanded {
      max-height: 600px;
    }
    .sidebar-category-header i.chevron {
      font-size: 1.1rem;
      transition: transform 0.3s ease;
      color: var(--text-muted);
    }
    .sidebar-category-header.active-header i.chevron {
      transform: rotate(180deg);
      color: var(--gold);
    }
    
    /* Collapsed state adjustments */
    .sidebar.collapsed .sidebar-category-header span,
    .sidebar.collapsed .sidebar-category-header i.chevron {
      display: none;
    }
    .sidebar.collapsed .sidebar-category-links {
      max-height: none !important;
      padding-left: 0;
    }
    .sidebar.collapsed .sidebar-category-wrapper {
      margin-bottom: 10px;
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 3px;
      gap: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      position: relative;
    }

    .sidebar-nav-item i {
      font-size: 1.15rem;
      color: var(--text-muted);
      width: 20px;
      text-align: center;
    }

    .sidebar-nav-item:hover {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .sidebar-nav-item:hover i {
      color: var(--gold);
    }

    .sidebar-nav-item.active {
      background-color: var(--gold-alpha);
      color: var(--gold-light);
      font-weight: 600;
      border: 1px solid var(--border);
    }

    .sidebar-nav-item.active i {
      color: var(--gold);
    }

    .sidebar-footer {
      padding: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-tertiary);
    }

    .sidebar-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--gold);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .sidebar-user-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .sidebar-user-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .sidebar-user-role {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    /* Collapsed Sidebar overrides */
    .sidebar.collapsed {
      width: var(--sidebar-collapsed);
    }
    .sidebar.collapsed .sidebar-brand span,
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .sidebar-nav-item span,
    .sidebar.collapsed .sidebar-footer {
      display: none;
    }
    .sidebar.collapsed .sidebar-nav-item {
      justify-content: center;
      padding: 12px;
    }

    /* Main Panel Layout */
    .main-panel {
      flex: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      min-width: 0;
      transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar.collapsed + .main-panel {
      margin-left: var(--sidebar-collapsed);
    }

    /* Topbar */
    .topbar {
      height: var(--topbar-height);
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 99;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .toggle-sidebar-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 6px;
    }

    .toggle-sidebar-btn:hover {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      padding: 6px 12px;
      border-radius: 8px;
      gap: 8px;
      width: 220px;
    }

    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.82rem;
      width: 100%;
    }

    .search-box i {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .topbar-action-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 8px;
      position: relative;
    }

    .topbar-action-btn:hover {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .topbar-action-btn .badge {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
    }

    .user-profile-menu {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    /* Login View Styles */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      padding: 20px;
    }

    .login-card {
      background: var(--glass);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeInUp 0.5s ease-out;
    }

    .login-header {
      text-align: center;
    }

    .login-header i {
      font-size: 3rem;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .login-header h2 {
      font-size: 1.7rem;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* ==========================================================================
       3. ATOMS & UTILITIES: BUTTONS, CARDS, INPUTS, TABLES & BADGES
       ========================================================================== */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title i {
      color: var(--gold);
      font-size: 1.1rem;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .col-span-2 { grid-column: span 2; }
    
    @media(max-width: 1024px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
    }
    @media(max-width: 768px) {
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .col-span-2 { grid-column: span 1; }
      .sidebar { display: none; }
      .main-panel { margin-left: 0 !important; }
    }

    /* Inputs */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control, select, textarea {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }

    .form-control:focus, select:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px var(--gold-alpha);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      gap: 8px;
      border: 1px solid transparent;
      outline: none;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--gold);
      color: var(--btn-text);
      border-color: var(--gold);
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: var(--gold-light);
      border-color: var(--gold-light);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      border-color: var(--border-light);
    }

    .btn-secondary:hover {
      background-color: var(--border-light);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      filter: brightness(1.1);
    }

    /* Table styles */
    .table-responsive {
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th {
      padding: 12px 16px;
      border-bottom: 2px solid var(--border);
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.5px;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-primary);
      vertical-align: middle;
    }

    tr:hover td {
      background-color: var(--bg-tertiary);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .badge-success { background-color: rgba(16, 185, 129, 0.12); color: var(--success); }
    .badge-danger { background-color: rgba(239, 68, 68, 0.12); color: var(--danger); }
    .badge-warning { background-color: rgba(245, 158, 11, 0.12); color: var(--badge-warning-text, var(--warning)); }
    .badge-info { background-color: rgba(59, 130, 246, 0.12); color: var(--info); }
    .badge-gold { background-color: var(--gold-alpha); color: var(--gold-light); }
    .badge-purple { background-color: rgba(139, 92, 246, 0.15); color: var(--purple-text, #a78bfa); }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      box-shadow: var(--shadow);
      animation: scaleUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 20px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background-color: var(--bg-tertiary);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* ==========================================================================
       4. ANIMATIONS
       ========================================================================== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .fade-in-up {
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Widgets & Stats styling */
    .stat-widget {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .stat-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .stat-label {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    
    .stat-val {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    
    .stat-icon-wrap {
      width: 44px;
      height: 44px;
      background-color: var(--gold-alpha);
      color: var(--gold-light);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      border: 1px solid var(--border);
    }

    /* Calendar Grid */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .cal-day-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 6px 0;
      text-transform: uppercase;
    }

    .cal-cell {
      aspect-ratio: 1.2;
      background-color: var(--bg-tertiary);
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 0.78rem;
      border: 1px solid var(--border-light);
      cursor: pointer;
    }

    .cal-cell.today {
      border-color: var(--gold);
      background-color: var(--gold-alpha);
    }

    .cal-cell.other-month {
      opacity: 0.3;
    }

    .cal-events {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 4px;
    }

    .cal-event-dot {
      height: 3px;
      border-radius: 2px;
      width: 100%;
    }

    /* Heatmap Grid */
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(24, 1fr);
      gap: 4px;
    }

    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 2px;
      background-color: var(--bg-tertiary);
    }

    /* Theme Switcher slider */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 34px;
      transition: .3s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: var(--gold);
      border-radius: 50%;
      transition: .3s;

      font-size: 0.85rem;

      border-bottom-color: var(--gold);

      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      margin-bottom: 6px;
      transition: all 0.2s ease;
    }

      background: var(--success-alpha);
      border-color: var(--success);
    }
    .habit-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.75rem;

      background-color: var(--success);
      border-color: var(--success);
    }

      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));

    .room-card {
      border: 1px solid var(--border);
      background-color: var(--bg-tertiary);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;

    .room-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);

    .room-num { font-size: 1.15rem; font-weight: 700; }
    .room-type { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

      right: 20px;
      width: 280px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);

    .custom-dropdown-trigger { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-primary); transition: border-color 0.2s; }

          // Merge 'Tour and Travels', 'Hotel With Resturant', 'Sport Academy', 'Canva' into 'MS'
          const categoriesToMerge = ['Tour and Travels', 'Hotel With Resturant', 'Sport Academy', 'Canva'];
          const foundLabels = this.cache.Menu.filter(m => m.type === 'label' && categoriesToMerge.includes(m.label));
          
          if (foundLabels.length > 0) {
            let msLabel = this.cache.Menu.find(m => m.type === 'label' && m.label === 'MS');
            if (!msLabel) {
              const minMergedOrder = Math.min(...foundLabels.map(l => Math.floor(Number(l.order || 3))));
              msLabel = { id: "m_ms", type: "label", label: "MS", icon: "", target: "", adminOnly: "false", order: minMergedOrder };
              this.cache.Menu.push(msLabel);
            }
            
            const mergedOrders = foundLabels.map(l => Math.floor(Number(l.order)));
            const msBase = Math.floor(Number(msLabel.order));
            let msSubCounter = 1;
            
            const existingMsLinks = this.cache.Menu.filter(m => m.type === 'link' && Math.floor(Number(m.order)) === msBase && !mergedOrders.includes(Math.floor(Number(m.order))));

              }
            }
          });
          if (changed) {

      handleRouting() {
        let rawHash = window.location.hash.slice(1) || 'dashboard';
        const hash = decodeURIComponent(rawHash).replace(/\s+/g, '').toLowerCase();
        
        // Auth Check
        const isAuth = localStorage.getItem('saas_logged_in') === 'true';
        if (!isAuth && hash !== 'login') {
          window.location.hash = '#login';
          return;
        }

        const userRole = localStorage.getItem('saas_user_role') || 'admin';
        // Compute adminOnly views dynamically from DB
        const adminViews = DB.cache.Menu.filter(m => m.adminOnly === 'true' && m.type === 'link').map(m => m.target.replace(/\s+/g, '').toLowerCase());
        if (isAuth && userRole === 'employee' && adminViews.includes(hash)) {
          window.location.hash = '#dashboard';
          setTimeout(() => showNotification('Access Denied: Admin role required.'), 200);
          return;
        }

        this.currentView = hash;
        this.renderShell();
        
        let routeKey = hash;
        if (hash.startsWith('hotel_') && !this.routes[hash]) routeKey = 'hoteldashboard';
        if (hash.startsWith('sport_') && !this.routes[hash]) routeKey = 'sportacademydashboard';
        if ((hash.startsWith('tour_') || hash === 'apnatourtravels') && !this.routes[hash]) routeKey = 'tourdashboard';

        if (hash.startsWith('custom_')) routeKey = 'custompage';

          document.querySelectorAll('.sidebar-nav-item').forEach(item => {
            const itemTarget = item.getAttribute('href').slice(1).replace(/\s+/g, '').toLowerCase();

    window.executeEditCard = function(oldTitle, dashboardHash, target) {
      const newTitle = document.getElementById('edit-card-title').value.trim();
      const newIcon = document.getElementById('edit-card-icon').value.trim();
      if (!newTitle) return;

      if (target.startsWith('custom_')) {
        const hotelKey = 'saas_hotel_custom_pages_' + dashboardHash;
        if (localStorage.getItem(hotelKey)) {
          let pages = JSON.parse(localStorage.getItem(hotelKey));
          let page = pages.find(p => p.title === oldTitle);
          if (page) { page.title = newTitle; page.icon = newIcon; }
          localStorage.setItem(hotelKey, JSON.stringify(pages));
        }
        const tourKey = 'saas_tour_custom_pages_' + dashboardHash;
        if (localStorage.getItem(tourKey)) {
          let pages = JSON.parse(localStorage.getItem(tourKey));
          let page = pages.find(p => p.title === oldTitle);
          if (page) { page.title = newTitle; page.icon = newIcon; }
          localStorage.setItem(tourKey, JSON.stringify(pages));
        }
        const sportKey = 'saas_sport_custom_pages_' + dashboardHash;
        if (localStorage.getItem(sportKey)) {
          let pages = JSON.parse(localStorage.getItem(sportKey));
          let page = pages.find(p => p.title === oldTitle);
          if (page) { page.title = newTitle; page.icon = newIcon; }
          localStorage.setItem(sportKey, JSON.stringify(pages));
        }
      } else {
        let edited = {};
        try {
          const raw = localStorage.getItem('saas_edited_cards_' + dashboardHash);
          if (raw) edited = JSON.parse(raw);
        } catch(e){}
        edited[oldTitle] = { title: newTitle, icon: newIcon };
        localStorage.setItem('saas_edited_cards_' + dashboardHash, JSON.stringify(edited));
      }

      if (window.showNotification) window.showNotification("Card updated successfully.");
      Router.handleRouting();
    };

            if (raw) deleted = JSON.parse(raw);
          } catch(e){}
          if (!deleted.includes(title)) {
            deleted.push(title);
            localStorage.setItem('saas_deleted_cards_' + dashboardHash, JSON.stringify(deleted));
          }
        }

        // 2. Remove custom cards
        try {
          const hotelKey = 'saas_hotel_custom_pages_' + dashboardHash;
          if (localStorage.getItem(hotelKey)) {
            let pages = JSON.parse(localStorage.getItem(hotelKey));
            localStorage.setItem(hotelKey, JSON.stringify(pages.filter(p => p.title !== title)));
          }
          const tourKey = 'saas_tour_custom_pages_' + dashboardHash;
          if (localStorage.getItem(tourKey)) {
            let pages = JSON.parse(localStorage.getItem(tourKey));
            pages = pages.filter(p => p.title !== title);
            localStorage.setItem(tourKey, JSON.stringify(pages));
          }
          const sportKey = 'saas_sport_custom_pages_' + dashboardHash;
          if (localStorage.getItem(sportKey)) {
            let pages = JSON.parse(localStorage.getItem(sportKey));
            pages = pages.filter(p => p.title !== title);
            localStorage.setItem(sportKey, JSON.stringify(pages));
          }
        } catch(e){}

        if (window.showNotification) window.showNotification("'" + title + "' deleted successfully.");
        document.querySelectorAll('.card-menu-dropdown').forEach(d => d.style.display = 'none');
        Router.handleRouting(); // Refresh view
      });
    };

    window.openRenameModal = function(currentName, onConfirm) {
      const existing = document.getElementById('custom-rename-modal');
      if (existing) existing.remove();

      const modalHTML = `
        <div id="custom-rename-modal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:9999; display:flex; justify-content:center; align-items:center; opacity:0; transition:opacity 0.3s;">
          <div class="card fade-in-up" style="background:var(--bg-secondary); padding:30px; border-radius:12px; width:90%; max-width:400px; box-shadow:0 10px 30px rgba(0,0,0,0.5); text-align:center;">
            <i class="material-icons-round" style="font-size:3.5rem; color:var(--gold); margin-bottom:15px;">edit_note</i>
            <h2 style="font-size:1.4rem; color:var(--text-primary); margin-bottom:10px;">Rename Item</h2>
            <p style="color:var(--text-secondary); margin-bottom:20px; font-size:0.9rem;">
              Enter a new name for <strong>${currentName}</strong>:
            </p>
            <div style="margin-bottom:25px;">
              <input type="text" id="rename-input-field" value="${currentName}" style="width:100%; padding:12px 15px; border-radius:8px; border:1px solid var(--border-light); background:var(--bg-tertiary); color:var(--text-primary); font-size:1rem; outline:none; text-align:center;" onkeydown="if(event.key === 'Enter') document.getElementById('confirm-rename-btn').click();">
            </div>
            <div style="display:flex; gap:15px;">
              <button class="btn" style="flex:1; background:var(--bg-tertiary); color:var(--text-primary); padding:10px;" onclick="document.getElementById('custom-rename-modal').style.opacity=0; setTimeout(()=>document.getElementById('custom-rename-modal').remove(), 300)">Cancel</button>
              <button id="confirm-rename-btn" class="btn" style="flex:1; background:var(--gold); color:var(--bg-primary); padding:10px; font-weight:600;" onclick="const val = document.getElementById('rename-input-field').value; document.getElementById('custom-rename-modal').remove(); window.executeRenameCallback(val)">Save</button>
            </div>
          </div>
        </div>
      `;
      
      const modalContainer = document.createElement('div');
      modalContainer.innerHTML = modalHTML;
      document.body.appendChild(modalContainer.firstElementChild);
      
      const inputEl = document.getElementById('rename-input-field');
      
      setTimeout(() => {
        const modal = document.getElementById('custom-rename-modal');
        if(modal) {
          modal.style.opacity = '1';
          inputEl.focus();
          inputEl.select();
        }
      }, 10);
      
      window.executeRenameCallback = onConfirm;
    };

    window.renameSidebarItem = function(id, currentName) {
      window.openRenameModal(currentName, (newName) => {
        if (newName && newName.trim() !== "" && newName !== currentName) {
          const item = DB.cache.Menu.find(m => m.id === id);
          if (item) {
            item.label = newName.trim();
            DB.saveTable('Menu').then(() => {
              if (window.showNotification) window.showNotification("Renamed successfully.");
              if (window.rebuildSidebar) window.rebuildSidebar();
            });
          }
        }
      });
    };

    window.deleteSidebarItem = function(id, name) {
      window.openDeleteModal(name, () => {
        DB.cache.Menu = DB.cache.Menu.filter(m => m.id !== id);
        DB.saveTable('Menu').then(() => {
          if (window.showNotification) window.showNotification("Deleted successfully.");
          if (window.rebuildSidebar) window.rebuildSidebar();
        });
      });
    };

    function toggleSidebar() {
      const sb = document.getElementById('app-sidebar');
      if (sb) sb.classList.toggle('collapsed');
    }

    window.updateCoins = function(amount) {
      let coins = parseInt(localStorage.getItem('saas_user_coins') || '0', 10);
      coins += amount;
      if (coins < 0) coins = 0;
      localStorage.setItem('saas_user_coins', coins);
      const display = document.getElementById('coin-count-display');
      if (display) {
        display.innerText = coins;
        display.style.transform = 'scale(1.3)';
        display.style.color = '#fff';
        setTimeout(() => {
          display.style.transform = 'scale(1)';
          display.style.color = '';
        }, 300);
      }
    };

    function toggleNotificationTray(e) {
      e.stopPropagation();
      const tray = document.getElementById('global-notifications');
      if (tray) {
        tray.style.display = tray.style.display === 'block' ? 'none' : 'block';
      }
    }

    document.addEventListener('click', () => {
      const tray = document.getElementById('global-notifications');
      if (tray) tray.style.display = 'none';
    });

    function showNotification(msg) {
      const body = document.getElementById('notification-body-content');
      const badge = document.querySelector('.topbar-action-btn .badge');
      if (badge) badge.style.display = 'block';

      if (body) {
        const item = document.createElement('div');
        item.className = 'notification-item';
        item.innerText = `${new Date().toLocaleTimeString()} - ${msg}`;
        // Remove empty placeholder
        if (body.innerText.includes('No notifications')) {
          body.innerHTML = '';
        }
        body.insertBefore(item, body.firstChild);
      }
    }

    function clearNotifications() {
      const body = document.getElementById('notification-body-content');
      const badge = document.querySelector('.topbar-action-btn .badge');
      if (badge) badge.style.display = 'none';
      if (body) {
        body.innerHTML = `<div class="notification-item" style="color:var(--text-muted);text-align:center;padding:20px;">No notifications.</div>`;
      }
    }

    function applyTheme() {
      const themeVal = DB.cache.Settings.find(s => s.key === "theme")?.value || 'dark';
      document.documentElement.setAttribute('data-theme', themeVal);
      setTimeout(() => {
        const iconEl = document.getElementById('nav-theme-toggle-icon');
        if (iconEl) {
          iconEl.innerText = themeVal === 'light' ? 'dark_mode' : 'light_mode';
        }
      }, 50);
    }

    function doLogout(e) {
      e.preventDefault();
      localStorage.setItem('saas_logged_in', 'false');
      localStorage.removeItem('saas_user_role');
      localStorage.removeItem('saas_user_name');
      localStorage.removeItem('saas_user_username');
      window.location.hash = '#login';
      window.location.reload();
    }

    function showModal(title, contentHtml, submitLabel, submitFn) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerHTML = contentHtml;
      const subBtn = document.getElementById('modal-submit-btn');
      subBtn.innerText = submitLabel;
      subBtn.onclick = () => {
        submitFn();
        hideModal();
      };
      document.getElementById('app-modal').style.display = 'flex';
    }

    function hideModal() {
      document.getElementById('app-modal').style.display = 'none';
      const modalContent = document.querySelector('.modal-content');
      if (modalContent) modalContent.style.maxWidth = '';
    }

    function closeModal(e) {
      if (e.target.id === 'app-modal') hideModal();
    }

    window.customPromptLink = function(callback) {
      const sel = window.getSelection();
      const savedRanges = [];
      for (let i = 0; i < sel.rangeCount; i++) {
        savedRanges.push(sel.getRangeAt(i).cloneRange());
      }

      const overlay = document.createElement('div');
      overlay.style.position = 'fixed';
      overlay.style.top = '0'; overlay.style.left = '0'; overlay.style.width = '100%'; overlay.style.height = '100%';
      overlay.style.backgroundColor = 'rgba(0,0,0,0.6)';
      overlay.style.zIndex = '10000';
      overlay.style.display = 'flex'; overlay.style.alignItems = 'center'; overlay.style.justifyContent = 'center';
      overlay.style.backdropFilter = 'blur(4px)';

      const box = document.createElement('div');
      box.style.background = 'var(--bg-secondary)';
      box.style.border = '1px solid var(--border)';
      box.style.padding = '24px';
      box.style.borderRadius = '12px';
      box.style.width = '350px';
      box.style.boxShadow = 'var(--shadow)';
      box.style.animation = 'scaleUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
      
      box.innerHTML = `
        <h4 style="margin:0 0 16px 0; display:flex; align-items:center; gap:8px;"><i class="fas fa-link" style="color:var(--gold);"></i> Insert Link</h4>
        <input type="text" id="custom-link-input" class="form-control" placeholder="https://example.com" style="margin-bottom:16px;">
        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button class="btn btn-secondary" id="custom-link-cancel">Cancel</button>
          <button class="btn btn-primary" id="custom-link-ok">Insert</button>
        </div>
      `;
      overlay.appendChild(box);
      document.body.appendChild(overlay);

      setTimeout(() => document.getElementById('custom-link-input').focus(), 100);

      const close = (val) => {
        document.body.removeChild(overlay);
        if(val) {
          const sel2 = window.getSelection();
          sel2.removeAllRanges();
          savedRanges.forEach(r => sel2.addRange(r));
          callback(val);
        }
      };

      document.getElementById('custom-link-cancel').onclick = () => close(null);
      document.getElementById('custom-link-ok').onclick = () => close(document.getElementById('custom-link-input').value);
      document.getElementById('custom-link-input').onkeydown = (e) => {
        if(e.key === 'Enter') close(e.target.value);
        if(e.key === 'Escape') close(null);
      };
    };

    function formatCurrency(amount) {
      const currency = DB.cache.Settings.find(s => s.key === 'currency')?.value || 'INR';
      const symbol = currency === 'INR' ? '₹' : '$';
      return `${symbol} ${Number(amount).toLocaleString()}`;
    }
